name: Set up bundled musl libraries
description: Build and cache static archive libraries, then configure Cargo for musl.
runs:
  using: composite
  steps:
    - name: Install musl build tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends musl-tools fish jq pkg-config lld
    - uses: actions/cache@v5
      id: libraries
      with:
        path: target/musl-native
        key: musl-libraries-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/build-musl-libraries.fish', 'scripts/native-libraries.json') }}
    - name: Build bundled libraries
      if: steps.libraries.outputs.cache-hit != 'true'
      shell: bash
      run: fish scripts/build-musl-libraries.fish "$GITHUB_WORKSPACE/target/musl-native"
    - name: Configure Cargo for musl
      shell: bash
      run: |
        prefix="$GITHUB_WORKSPACE/target/musl-native"
        case "$RUNNER_ARCH" in
          X64) target=x86_64-unknown-linux-musl ;;
          ARM64) target=aarch64-unknown-linux-musl ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        target_key="${target//-/_}"
        {
          echo "CARGO_BUILD_TARGET=$target"
          echo "CARGO_TARGET_${target_key^^}_LINKER=musl-gcc"
          echo "CC_$target_key=musl-gcc"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,--no-dynamic-linker" # musl-gcc supplies a dynamic loader that LLD retains even with -static.
          echo "LIBARCHIVE_LIB_DIR=$prefix/lib"
          echo "LIBARCHIVE_INCLUDE_DIR=$prefix/include"
          echo 'LIBARCHIVE_STATIC=1'
          echo "LIBARCHIVE_LDFLAGS=-L$prefix/lib -lzstd -lbz2 -lz -llzma"
        } >> "$GITHUB_ENV"
