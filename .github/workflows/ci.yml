name: CI
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install remote sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --check
      - run: dotnet build tests/metadata-fixture -c Release
      - run: cargo test --locked --all-targets -- --include-ignored
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: dotnet build tests/metadata-oracle -c Release
      - name: Compare native signatures with the reference reader
        run: |
          dotnet tests/metadata-oracle/bin/Release/net10.0/MetadataOracle.dll --signatures tests/metadata-fixture/bin/Release/net10.0/MetadataFixture.dll > target/signatures.json
          cargo run --locked --example metadata_compare -- tests/metadata-fixture/bin/Release/net10.0/MetadataFixture.dll target/signatures.json
