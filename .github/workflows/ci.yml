name: CI
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install remote sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          curl -fsSL https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz -o "$RUNNER_TEMP/bubblewrap.tar.xz"
          tar -xf "$RUNNER_TEMP/bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bubblewrap-build" "$RUNNER_TEMP/bubblewrap-0.11.2" -Dtests=false -Dman=disabled -Dselinux=disabled
          meson compile -C "$RUNNER_TEMP/bubblewrap-build"
          echo "$RUNNER_TEMP/bubblewrap-build" >> "$GITHUB_PATH"
      - name: Run checks
        env:
          SIGLA_TEST_WITH_SUDO: "1"
        run: bash scripts/check-ci.sh
