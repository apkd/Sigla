name: Build, test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump_level:
        description: Version increment level
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish publication on master. Other refs can discard superseded work.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTFLAGS: -C link-arg=-fuse-ld=lld
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.nuget/packages
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-dev pkg-config lld
      - name: Check formatting and lint all targets
        run: bash scripts/check-ci.sh lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Describe job
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Source and protocol tests

          | Gate | Coverage |
          | ---- | -------- |
          | Rust suite | Unit and integration tests, including HTTP and remote lifecycle tests |
          | Metadata comparison | C# fixture checked against the .NET oracle |
          | SDK tests | Explicitly enabled metadata and C# oracle tests |

          EOF
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.nuget/packages
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Restore sandbox executable
        id: bubblewrap
        uses: actions/cache@v5
        with:
          path: ~/.cache/sigla-ci/bin
          key: bubblewrap-0.11.2-ubuntu-24.04-${{ runner.arch }}-v1
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-dev pkg-config lld libcap2
          echo "$HOME/.cache/sigla-ci/bin" >> "$GITHUB_PATH"
      - name: Build sandbox executable
        if: steps.bubblewrap.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev
          curl -fsSL --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz -o "$RUNNER_TEMP/bubblewrap.tar.xz"
          echo "69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6  $RUNNER_TEMP/bubblewrap.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bubblewrap-build" "$RUNNER_TEMP/bubblewrap-0.11.2" -Dtests=false -Dman=disabled -Dselinux=disabled
          meson compile -C "$RUNNER_TEMP/bubblewrap-build"
          install -Dm755 "$RUNNER_TEMP/bubblewrap-build/bwrap" "$HOME/.cache/sigla-ci/bin/bwrap"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Run tests and metadata oracles
        env:
          SIGLA_TEST_WITH_SUDO: '1'
          SIGLA_TEST_REPORTS: '1'
        run: bash scripts/check-ci.sh test
      - name: Test results
        if: ${{ !cancelled() && hashFiles('target/nextest/*/junit.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Rust and SDK tests
          reporter: java-junit
          path: target/nextest/*/junit.xml
          list-tests: all
          fail-on-error: false

  build:
    # Avoid expensive optimized builds when this run cannot publish a release.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Plan release version
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.bump_level || 'patch' }}
        run: |
          current="$(sed -n '/^\[package\]$/,/^\[dependencies\]$/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a package version in x.y.z form; got '$current'."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_LEVEL" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unsupported version increment '$BUMP_LEVEL'."; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          previous_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++')"
          {
            echo "version=$version"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Use the checked-in manifests for cache lookup, before build-only version edits.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.nuget/packages
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-dev pkg-config lld
      - name: Build release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i '/^\[package\]$/,/^\[dependencies\]$/s/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.toml
          sed -i '/^name = "sigla"$/,/^\[\[package\]\]$/s/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.lock
          cargo build --locked --release --bin sigla
          mkdir -p release-assets
          cp target/release/sigla release-assets/sigla-linux-x64
          (cd release-assets && sha256sum sigla-linux-x64 > SHA256SUMS)
      - name: Smoke-test the release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          executable="$PWD/release-assets/sigla-linux-x64"
          [[ "$("$executable" --version)" == "sigla $VERSION" ]]
          work="$RUNNER_TEMP/release-smoke"
          mkdir -p "$work/src"
          printf '[package]\nname = "release-smoke"\nversion = "0.0.0"\nedition = "2024"\n' > "$work/Cargo.toml"
          printf 'pub struct ReleaseSmoke;\n' > "$work/src/lib.rs"
          "$executable" --cache-dir "$work/cache" query "$work" type:ReleaseSmoke | tee "$work/query.txt"
          grep -q ReleaseSmoke "$work/query.txt"

          "$executable" --cache-dir "$work/cache" serve --listen 127.0.0.1:17331 > "$work/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; cat "$work/server.log"' EXIT
          url=http://127.0.0.1:17331/mcp
          # MCP permits either JSON or an SSE stream carrying the JSON response.
          response() {
            jq -Rse 'fromjson? // ([split("\n")[] | select(startswith("data:")) | .[5:] | fromjson? | select(.id != null)] | last)' "$1"
          }
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused --max-time 5 \
            -D "$work/headers" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}' \
            "$url" > "$work/initialize.json"
          response "$work/initialize.json" | jq -e '.result.serverInfo.name'
          session="$(awk 'tolower($1) == "mcp-session-id:" {gsub("\r", "", $2); print $2}' "$work/headers")"
          [[ -n "$session" ]]
          headers=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "Mcp-Session-Id: $session" -H 'MCP-Protocol-Version: 2025-03-26')
          curl -fsS --max-time 10 "${headers[@]}" -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$url"
          curl -fsS --max-time 10 "${headers[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' "$url" > "$work/tools.json"
          response "$work/tools.json" | jq -e '.result.tools | any(.[]; .name == "search" and (.inputSchema.properties | has("codebase")))'
          jq -n --arg codebase "$work" '{jsonrpc:"2.0",id:3,method:"tools/call",params:{name:"search",arguments:{codebase:$codebase,query:"type:ReleaseSmoke"}}}' > "$work/request.json"
          curl -fsS --max-time 30 "${headers[@]}" --data-binary "@$work/request.json" "$url" > "$work/result.json"
          response "$work/result.json" | jq -e '.result | .isError != true and any(.content[]; .text | contains("ReleaseSmoke"))'
      - uses: actions/upload-artifact@v6
        with:
          name: sigla-linux-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: release-version
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: ${{ runner.temp }}/release-version
      - name: Commit and tag the tested version
        id: push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git fetch origin master --quiet
          if [[ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]]; then
            echo '::notice::Master advanced; skipping this release.'
            exit 0
          fi
          cp "$RUNNER_TEMP/release-version/Cargo.toml" Cargo.toml
          cp "$RUNNER_TEMP/release-version/Cargo.lock" Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "Sigla $VERSION [release] [skip ci]"
          git tag "v$VERSION"
          # A normal atomic push rejects branch races and leaves neither ref half-updated.
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [build, prepare]
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: sigla-linux-x64
          path: release-assets
      - name: Prepare release notes
        run: |
          notes=release-notes.md
          repo_url="https://github.com/$GITHUB_REPOSITORY"
          declare -A since=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            while read -r sha; do
              since["$sha"]=1
            done < <(git rev-list "$PREVIOUS_TAG..$RELEASE_SHA")
          fi

          cat > "$notes" <<MD
          This is a rolling release. Whenever all tests pass on master, it is
          automatically updated to point to the latest release tag.

          Installation
          --------------
          Compatibility: ***Linux x64, Ubuntu 24.04 or newer***

          Download the binary and verify its checksum:

          \`\`\`sh
          curl -fLO $repo_url/releases/download/release/sigla-linux-x64
          curl -fLO $repo_url/releases/download/release/SHA256SUMS
          sha256sum -c SHA256SUMS
          chmod +x sigla-linux-x64
          ./sigla-linux-x64 serve
          \`\`\`

          Requires the libarchive runtime (\`libarchive13t64\` on Ubuntu 24.04).
          C# project discovery also requires a .NET SDK and bubblewrap 0.11 or newer.
          See the [setup instructions]($repo_url/blob/release/README.md).

          Latest changes
          --------------
          | Author | Release | Commit | SHA |
          | ------ | ------- | ------ | --- |
          MD

          # One API request supplies author profiles for the whole table.
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=$RELEASE_SHA&per_page=24" > "$RUNNER_TEMP/commits.json"
          mapfile -t rel_tags < <(git for-each-ref --sort=creatordate --format='%(refname:short)' refs/tags | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/')
          declare -A tag_commits=()
          for tag in "${rel_tags[@]}"; do tag_commits["$tag"]="$(git rev-list -n 1 "$tag")"; done
          count=0
          while IFS=$'\t' read -r sha msg author email; do
            if [[ "${author,,}" == 'github-actions[bot]' || "${email,,}" == '41898282+github-actions[bot]@users.noreply.github.com' ]]; then continue; fi
            shortlink="[${sha:0:7}]($repo_url/commit/$sha)"
            msg="${msg//|/\\|}"
            info="$(jq -c --arg sha "$sha" 'first(.[] | select(.sha == $sha)) | {login:(.author.login // .committer.login), profile:(.author.html_url // .committer.html_url), avatar:(.author.avatar_url // .committer.avatar_url)}' "$RUNNER_TEMP/commits.json")"
            login="$(jq -r '.login // empty' <<< "$info")"
            profile="$(jq -r '.profile // empty' <<< "$info")"
            avatar="$(jq -r '.avatar // empty' <<< "$info")"
            if [[ -z "$avatar" ]]; then
              if [[ -n "$email" ]]; then
                hash="$(printf '%s' "${email,,}" | md5sum | cut -d ' ' -f 1)"
                base="www.gravatar.com/avatar/$hash?d=identicon"
              else
                base='www.gravatar.com/avatar/?d=mp'
              fi
              avatar="https://wsrv.nl/?url=${base}&w=48&h=48&mask=circle&fit=cover&maxage=1w"
            fi
            author="${author//|/\\|}"
            author="${author%\[bot\]}"
            if [[ -n "$login" && -n "$profile" ]]; then
              author_cell="<a href=\"$profile\"><img src=\"$avatar\" width=\"24\" height=\"24\" /></a> @${login%\[bot\]}"
            else
              author_cell="<img src=\"$avatar\" width=\"24\" height=\"24\" /> $author"
            fi
            version='-'
            for tag in "${rel_tags[@]}"; do
              if git merge-base --is-ancestor "$sha" "${tag_commits[$tag]}"; then
                version="$tag"
                break
              fi
            done
            if [[ -n "${since[$sha]:-}" ]]; then version="✨ $version"; fi
            printf '| %s | %s | %s | %s |\n' "$author_cell" "$version" "$msg" "$shortlink" >> "$notes"
            count=$((count + 1))
            if [[ "$count" -ge 16 ]]; then break; fi
          done < <(git log -n 24 "$RELEASE_SHA" --pretty=format:%H%x09%s%x09%an%x09%ae; echo)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n#### [View diff since previous tagged release](%s/compare/%s...release)\n' "$repo_url" "$PREVIOUS_TAG" >> "$notes"
          fi
          printf '\n#### [More recent commits](%s/commits/master/)\n' "$repo_url" >> "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify release target
        id: verify
        run: |
          git fetch origin master --quiet
          if [[ "$(git rev-parse origin/master)" != "$RELEASE_SHA" ]]; then
            echo '::notice::Master advanced; leaving the rolling release unchanged.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            printf '\n### Release skipped\n\nMaster no longer points to the release commit.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update rolling release
        if: steps.verify.outputs.changed == 'false'
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          files=(release-assets/sigla-linux-x64 release-assets/SHA256SUMS)
          for file in "${files[@]}"; do test -s "$file"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa release "$RELEASE_SHA" -m 'Latest rolling release'
          git push -f origin refs/tags/release

          if gh release view release >/dev/null 2>&1; then
            gh release edit release --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create release --title "v$VERSION" --notes-file release-notes.md --target "$RELEASE_SHA" --draft
          fi
          gh release upload release "${files[@]}" --clobber
          assets="$(gh release view release --json assets)"
          mapfile -t published < <(jq -r '.assets[].name' <<< "$assets")
          for asset in "${published[@]}"; do
            case "$asset" in
              sigla-linux-x64|SHA256SUMS) ;;
              *) gh release delete-asset release "$asset" --yes ;;
            esac
          done

          info="$(gh release view release --json apiUrl,publishedAt)"
          release_api="$(jq -r '.apiUrl' <<< "$info")"
          previous_date="$(jq -r '.publishedAt // ""' <<< "$info")"
          # Republish the same release to refresh its date without losing reactions.
          trap 'echo "::warning::Release refresh failed; retrying publication."; gh api --method PATCH "$release_api" -f tag_name=release -F draft=false -f make_latest=true >/dev/null' EXIT
          gh api --method PATCH "$release_api" -f tag_name=release -F draft=true >/dev/null
          refreshed="$(gh api --method PATCH "$release_api" -f tag_name=release -F draft=false -f make_latest=true)"
          trap - EXIT
          if ! jq -e --arg previous "$previous_date" '.tag_name == "release" and .draft == false and .published_at > $previous' <<< "$refreshed" >/dev/null; then
            echo '::error::Release tag or publication date is incorrect.'
            exit 1
          fi
          echo "Release publication date: $(jq -r '.published_at' <<< "$refreshed")" >> "$GITHUB_STEP_SUMMARY"
